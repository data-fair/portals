services:

  #####
  # reverse proxy for the whole environment
  #####

  nginx:
    image: nginx:1.29.4-alpine
    network_mode: host
    environment:
      - DEV_HOST=${DEV_HOST}
      - NGINX_PORT=${NGINX_PORT}
      - SD_PORT=${SD_PORT}
      - DF_PORT=${DF_PORT}
      - EVENTS_PORT=${EVENTS_PORT}
      - AGENTS_PORT=${AGENTS_PORT}
      - MCP_PORT=${MCP_PORT}
      - DEV_API_PORT=${DEV_API_PORT}
      - DEV_UI_PORT=${DEV_UI_PORT}
      - DEV_PORTAL_PORT=${DEV_PORTAL_PORT}
    volumes:
      - ./dev/resources/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro

  #####
  # required services from the data-fair stack
  #####

  simple-directory:
    # SD_IMAGE: another simple-directory build (the pseudo sessions of the page preview need SECRET_PSEUDO_SESSION support)
    image: ${SD_IMAGE:-ghcr.io/data-fair/simple-directory:master}
    network_mode: host
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - PORT=${SD_PORT}
      - PUBLIC_URL=http://${DEV_HOST}:${NGINX_PORT}/simple-directory
      - MONGO_URL=mongodb://localhost:${MONGO_PORT}/simple-directory
      - OBSERVER_ACTIVE=false
      - CIPHER_PASSWORD=dev-cipher-password-0123456789abcdef
      - STORAGE_TYPE=file
      - ADMINS=["test_superadmin@test.com","superadmin@dev.com","alban.mouton@koumoul.com"]
      - CONTACT=contact@test.com
      # in dev simple-directory only notifies this service, directly (the shared identities router refuses calls through the proxy)
      - IDENTITIES_WEBHOOKS=[{"base":"http://localhost:${DEV_API_PORT}/api/identities","key":"secret-identities"}]
      # tests log in through the API many times per minute
      - AUTHRATELIMIT_ATTEMPTS=200
      - AUTHRATELIMIT_DURATION=1
      - MANAGE_DEPARTMENTS=true
      - MANAGE_PARTNERS=true
      - MANAGE_SITES=true
      # non-human identities, declared in dev/resources/users.template.json (the scope tests, the
      # autonomous-agent simulations)
      - MANAGE_NHIS=true
      # dev only: the agents NHI issuer is plain http on a .localhost host, which assertSafeIssuer refuses otherwise
      - NHIS_ALLOW_INSECURE_ISSUERS=true
      # the token endpoint the agents service's autonomous agents get their bearer tokens from (off by default)
      - OAUTH_SERVER_ENABLED=true
      # the scopes an NHI may hold: those of every service of data-fair's platform document (portals included,
      # data-fair merges it through PRIVATE_PORTALS_MANAGER_URL)
      - PLATFORM_SCOPES_URL=http://localhost:${DF_PORT}/api/v1/scopes.json
      - SECRET_SITES=secret-sites
      - SECRET_EVENTS=secret-events
      - SECRET_SENDMAILS=secret-sendmails
      # short-lived GET-only sessions of the caller, asked by the page preview (portals secretKeys.pseudoSession)
      - SECRET_PSEUDO_SESSION=secret-pseudo-session
      # contact form of the portals, its mails go to maildev
      - ANONYMOUS_CONTACT_FORM=true
      - MAILDEV_ACTIVE=true
      - MAILDEV_URL=http://localhost:${MAILDEV_UI_PORT}
      - MAILS_TRANSPORT={"host":"localhost","port":${MAILDEV_SMTP_PORT},"ignoreTLS":true}
      # per recipient, stored in mongo: repeated test runs would stop the mails silently
      - MAILSRATELIMIT_POINTS=100000
    volumes:
      # rendered from users.template.json with the host and port of .env (dev/render-users.mjs)
      - ./dev/resources/users.json:/app/data/users.json
      - ./dev/resources/organizations.json:/app/data/organizations.json
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "${SD_PORT}"]
      interval: 2s
      timeout: 2s
      retries: 60

  data-fair:
    # DF_IMAGE: another data-fair build (data-fair:master accepts the portals secret key that agent sessions sync publication sites with)
    image: ${DF_IMAGE:-ghcr.io/data-fair/data-fair:master}
    restart: on-failure:10
    network_mode: host
    depends_on:
      mongo:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - PORT=${DF_PORT}
      - PUBLIC_URL=http://${DEV_HOST}:${NGINX_PORT}/data-fair
      - WS_PUBLIC_URL=ws://${DEV_HOST}:${NGINX_PORT}/data-fair
      - DIRECTORY_URL=http://${DEV_HOST}:${NGINX_PORT}/simple-directory
      - PRIVATE_DIRECTORY_URL=http://localhost:${SD_PORT}
      - PRIVATE_EVENTS_URL=http://localhost:${EVENTS_PORT}
      # turns on the back-office agent chat (agentsIntegration), needed by the simulations
      - PRIVATE_AGENTS_URL=http://localhost:${AGENTS_PORT}
      - MONGO_URL=mongodb://localhost:${MONGO_PORT}/data-fair
      - ES_HOST=http://localhost:${ES_PORT}
      # single dev node: a replica would stay unassigned, the cluster yellow and /ping 500
      - ES_NB_REPLICAS=0
      - OBSERVER_ACTIVE=false
      # default: 3 koumoul.com remote services fetched at boot, extensions would call production
      - REMOTE_SERVICES=[]
      - CACHE_PUBLIC_MAX_AGE=1
      # one IP for every test and the portal SSR: the per-IP / per-user limits answer 429
      - DEFAULT_LIMITS_API_RATE_ANONYMOUS_NB=100000
      - DEFAULT_LIMITS_API_RATE_USER_NB=100000
      - DEFAULT_LIMITS_API_RATE_ANONYMOUS_COMPUTE_MS=0
      - DEFAULT_LIMITS_API_RATE_USER_COMPUTE_MS=0
      - DEFAULT_LIMITS_API_RATE_ANONYMOUS_BANDWIDTH_DYNAMIC=100000000
      - DEFAULT_LIMITS_API_RATE_USER_BANDWIDTH_DYNAMIC=100000000
      - WORKER_BASE_CONCURRENCY=1
      # tile cache capped collection, 2 GB by default
      - CACHE_MONGO_SIZE=200
      - SECRET_EVENTS=secret-events
      # publication-site writes of portals for its scope-restricted sessions (portals secretKeys.dataFair)
      - SECRET_PORTALS=secret-portals
      - PRIVATE_PORTALS_MANAGER_URL=http://localhost:${DEV_API_PORT}
    volumes:
      # the image declares an anonymous /data: datasets files would vanish on recreate while mongo keeps them
      - data-fair-data:/data

  #####
  # optional services
  #####

  events:
    profiles:
      - events
    image: ghcr.io/data-fair/events:main
    network_mode: host
    depends_on:
      - mongo
    environment:
      - PORT=${EVENTS_PORT}
      - PRIVATE_DIRECTORY_URL=http://localhost:${SD_PORT}
      - MONGO_URL=mongodb://localhost:${MONGO_PORT}/data-fair-events
      - OBSERVER_ACTIVE=false
      - SECRET_IDENTITIES=secret-identities
      - SECRET_EVENTS=secret-events
      - SECRET_SENDMAILS=secret-sendmails

  agents:
    profiles:
      - agents
    image: ghcr.io/data-fair/agents:main
    network_mode: host
    depends_on:
      - mongo
      - mcp
    environment:
      - PORT=${AGENTS_PORT}
      - PRIVATE_DIRECTORY_URL=http://localhost:${SD_PORT}
      - PRIVATE_EVENTS_URL=http://localhost:${EVENTS_PORT}
      - MONGO_URL=mongodb://localhost:${MONGO_PORT}/data-fair-agents
      - OBSERVER_ACTIVE=false
      - CIPHER_PASSWORD=dev-cipher-password-0123456789abcdef
      - SECRET_EVENTS=secret-events
      # the image has no model by default: the mock provider of agents' development config
      - PROVIDERS=[{"type":"mock","id":"global-mock","name":"Global Mock","enabled":true}]
      - MODELS=[{"id":"mock-model","name":"Global Mock Model","provider":"global-mock","usage":["assistant","tools","summarizer","moderator"],"inputPricePerMillion":0,"outputPricePerMillion":0}]
      - DEFAULT_MODELS={"assistant":{"provider":"global-mock","id":"mock-model"}}
      - DEFAULT_CREDITS=-1
      # NODE_ENV=development only for POST /api/test-env/autonomous-agent: an NHI declared in
      # simple-directory's files pins the agent id (autonomous-agent:<id>), which the public creation
      # route always generates. The configuration stays the image's production one.
      - NODE_ENV=development
      - NODE_CONFIG_ENV=production
      - SSRF_PUBLIC_IPS=127.0.0.1,::1
      # the agents repo's development signing key, public by design: it only signs dev NHI assertions
      - 'NHI_SIGNING_KEY={"kty":"EC","crv":"P-256","x":"iuGRxiUsSj4YmAvrp3XpXGnvttc6ruQIYakEVp-B4Ig","y":"nF0kPlKpzNztlqKozkb9T4sHl_sCD1M6ngrpwEnTL-M","d":"Hv71PS5oK6z6bqiRT-nq62cmgauiaCreaO-zmS30-6Q","kid":"dev-1","alg":"ES256"}'
      # data-fair's mcp, built into every autonomous agent with an identity: called as the agent, its reach
      # the identity's scopes
      - PRIVATE_MCP_URL=http://${DEV_HOST}:${NGINX_PORT}/mcp-server/mcp
      # the approval reviewer's stage 1 runs on the dev bridge, which starts a Claude Code session per call:
      # the production 5 s timeout turns most reviews into cards there (agents docs, moderation.md)
      - APPROVAL_REVIEW_STAGE1_TIMEOUT_MS=15000

  # the MCP server built from /data-fair/api/v1/platform/api-docs.json (portals merged in): /mcp-server/mcp
  # (every tool, filtered by the caller's scopes, credentials required). Started with the agents (their
  # autonomous agents call it) or on its own (profile mcp)
  mcp:
    profiles:
      - mcp
      - agents
    image: ghcr.io/data-fair/mcp:main
    network_mode: host
    environment:
      - TRANSPORT=http
      - PORT=${MCP_PORT}
      - MAIN_SITE_URL=http://${DEV_HOST}:${NGINX_PORT}
      # the signing keys that verify callers' sessions and tokens
      - PRIVATE_DIRECTORY_URL=http://localhost:${SD_PORT}
      # sent as in production; the dev nginx has no request limiting and does not read it
      - TRUSTED_FORWARDER=dev-trusted-forwarder
      - SSRF_PUBLIC_IPS=127.0.0.1,::1
      # tool titles are shown to people (chat chips)
      - LOCALE=fr
      - OBSERVER_ACTIVE=false
      # seconds between refreshes of the platform document
      - REFRESH_INTERVAL=10

  #####
  # tools
  #####

  # renders the pages of the portals for the page preview of the agents (called by the api only)
  capture:
    profiles:
      - capture
    image: ${CAPTURE_IMAGE:-ghcr.io/data-fair/capture:master}
    network_mode: host
    shm_size: '1gb'
    environment:
      - PORT=${CAPTURE_PORT}
      - ONLY_SAME_HOST=true
      - SECRET_INSPECT=secret-capture
      - OBSERVER_ACTIVE=false
      - PUPPETEER_ARGS=["--no-sandbox"]

  maildev:
    profiles:
      - maildev
    image: maildev/maildev:2.1.0
    ports:
      - ${MAILDEV_UI_PORT}:1080
      - ${MAILDEV_SMTP_PORT}:1025
    # https://github.com/maildev/maildev/issues/484
    healthcheck:
      test: 'wget -O - http://127.0.0.1:$${MAILDEV_WEB_PORT}$${MAILDEV_BASE_PATHNAME}/healthz || exit 1'

  #####
  # db and search engine
  #####

  elasticsearch:
    image: ghcr.io/data-fair/elasticsearch:8.19.9
    ports:
      - ${ES_PORT}:9200
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ingest.geoip.downloader.enabled=false
      # features the services never use, skipped to lighten the boot
      - xpack.ml.enabled=false
      - xpack.watcher.enabled=false
      - stack.templates.enabled=false
      - cluster.deprecation_indexing.enabled=false
      # heap starts at 64m and grows up to 512m (pre-touching a fixed 512m cost ~360m per idle stack)
      - ES_JAVA_OPTS=-Xms64m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      # 2 s probes while starting (df-dev wait-deps gives up after 3 min), then one per minute
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 3m
      start_interval: 2s
    mem_limit: 2g
    # no swap: an idle ES got 1.7 GB swapped out
    memswap_limit: 2g
    # halves the boot CPU burst (ES sizes its thread pools, GC and JIT threads to the quota)
    cpus: 2

  mongo:
    # production version; later 8.0 patches refuse Ubuntu 7.0 kernels (https://jira.mongodb.org/browse/SERVER-136848)
    image: mongo:8.0.17
    ports:
      - ${MONGO_PORT}:27017
    # wiredTiger takes half the machine's RAM by default
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      # 2 s probes while starting, then one per minute: a mongosh probe costs ~1.3 s of CPU
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 3m
      start_interval: 2s

volumes:
  elasticsearch-data:
  mongo-data:
  data-fair-data:
