name: Quality checks

# The full gate. One build job (types, vjsf components, UI) shared as an artifact; static
# checks and unit tests in one job; api and e2e tests on fresh runners with the core services
# and the dev processes of the zellij layout (ingress-manager, api, ui, portal), single worker
# each (tests share one dev env state).
# Split by project, then the e2e half in 2 shards: measured 2026-10 locally, api takes ~1 min
# and e2e ~16 min on one worker; the e2e warm-up (cold nuxt and vite, ~3 min) runs on each shard.
# Used by pull requests, releases and the nightly check of master; the pre-push hook only
# runs a light subset (dev/pre-push.sh).

on:
  workflow_call:
    inputs:
      retries:
        description: playwright retries per failed test (the nightly run uses 0 to expose flaky tests)
        type: number
        default: 1
      browser:
        description: browser engine of the e2e tests (chromium, firefox or webkit; the nightly run rotates them)
        type: string
        default: chromium
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout git repository
      uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # the generated .type modules and vjsf components are imported by the API, the tests,
    # the UI and the portal
    - name: Build types
      run: npm run build-types

    # also generates the ui/dts files vue-tsc needs
    - name: Build UI
      run: npm -w ui run build

    - name: Upload build outputs
      uses: actions/upload-artifact@v4
      with:
        name: build
        include-hidden-files: true # the .type directories
        retention-days: 1
        path: |
          **/.type/
          !**/node_modules/**
          ui/src/components/vjsf/
          ui/dist/
          ui/dts/

  static:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout git repository
      uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Download build outputs
      uses: actions/download-artifact@v4
      with:
        name: build

    - name: Lint
      run: npm run lint

    - name: Type check
      run: npm run check-types

    - name: Audit
      run: npm audit --omit=dev --audit-level=critical

    # no server needed
    - name: Unit tests
      run: npm run test-unit

  tests:
    name: tests (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, project: api, args: '' }
          - { name: e2e 1/2, project: e2e, args: '--shard=1/2' }
          - { name: e2e 2/2, project: e2e, args: '--shard=2/2' }
    env:
      # empty on workflow_dispatch, where playwright.config.ts falls back to 1
      TEST_RETRIES: ${{ inputs.retries }}
      # empty on workflow_dispatch, where playwright.config.ts falls back to chromium
      TEST_BROWSER: ${{ inputs.browser }}
    steps:
    - name: Checkout git repository
      uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Download build outputs
      uses: actions/download-artifact@v4
      with:
        name: build

    # only the browser binaries are cached, keyed on the installed playwright version and engine;
    # the system packages they need are installed on every run
    - name: Read the playwright version
      id: playwright
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache playwright browsers
      if: matrix.project == 'e2e'
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ inputs.browser || 'chromium' }}

    - name: Install playwright browser
      if: matrix.project == 'e2e' && steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps ${{ inputs.browser || 'chromium' }}

    - name: Install playwright system dependencies
      if: matrix.project == 'e2e' && steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps ${{ inputs.browser || 'chromium' }}

    - name: Init .env
      run: ./node_modules/.bin/df-dev init-env # local bin only: a bare npx would fetch an unrelated "df-dev" from the registry if the dependency were missing

    # a subdomain of localhost, not localhost itself: chromium does not send a cookie set on the
    # .localhost domain to the portals' {id}.portals.<DEV_HOST> subdomains (French, cache bypass)
    - name: Use ci.localhost as DEV_HOST in CI
      run: sed -i 's/^DEV_HOST=.*/DEV_HOST=ci.localhost/' .env

    # the core services only, like a developer's default env: no test needs an optional one
    - name: Start docker compose services
      run: docker compose up -d --wait

    # the commands of the zellij layout (.zellij.kdl), logs written to dev/logs/
    # the API runs in development like on a developer machine: the dev env is the test env
    - name: Start dev processes
      run: |
        mkdir -p dev/logs
        set -a; . ./.env; set +a
        NODE_ENV=development node --disable-warning=ExperimentalWarning dev/ingress-manager.ts > dev/logs/ingress-manager.log 2>&1 &
        # absent-config like the api pane: events is not in the CI core
        (export NODE_CONFIG=$(./node_modules/.bin/df-dev absent-config) && cd api && NODE_ENV=development node index.ts > ../dev/logs/api.log 2>&1 &)
        (cd ui && NODE_CONFIG_DIR=../api/config/ ../node_modules/.bin/vite --port "$DEV_UI_PORT" > ../dev/logs/ui.log 2>&1 &)
        (cd portal && NUXT_MONGO_URL="mongodb://localhost:$MONGO_PORT/data-fair-portals-development" \
          NUXT_PORTAL_URL_PATTERN="http://{subdomain}.portals.$DEV_HOST:$NGINX_PORT" \
          NUXT_PRIVATE_DIRECTORY_URL="http://localhost:$SD_PORT" \
          NUXT_FRAME_ANCESTORS="http://$DEV_HOST:$NGINX_PORT" \
          ../node_modules/.bin/nuxt dev > ../dev/logs/portal.log 2>&1 &)

    - name: Wait for the dev API, UI and portal to be ready
      run: |
        set -a; . ./.env; set +a
        for i in $(seq 1 90); do
          if curl -sf "http://localhost:${DEV_API_PORT}/api/ping" >/dev/null \
            && curl -sf "http://localhost:${DEV_UI_PORT}/portals-manager/" >/dev/null \
            && curl -sf "http://localhost:${DEV_PORTAL_PORT}/ping" >/dev/null; then
            exit 0
          fi
          sleep 2
        done
        echo "dev API, UI or portal did not become ready" >&2
        tail -n 50 dev/logs/*.log
        exit 1

    - name: Run api and e2e tests
      run: npm run test -- --project=${{ matrix.project }} ${{ matrix.args }}

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ strategy.job-index }}
        path: |
          test-results/
          dev/logs/
        retention-days: 7

    - name: Docker compose logs on failure
      if: failure()
      run: docker compose --profile '*' logs

    - name: Stop docker compose services
      if: always()
      run: docker compose --profile '*' down
